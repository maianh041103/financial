server.port=8081
vaadin.launch-browser=true
spring.application.name=financial
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/financial}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:maianh20}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database config
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%logger{36}.%M:%line] - %msg%n